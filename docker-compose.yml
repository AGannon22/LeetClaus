#   Local dev:   docker compose up --build   (also loads docker-compose.override.yml)
#   Production:  docker compose -f docker-compose.yml up -d --build

services:
  web:
    build: .
    container_name: leetclause-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-leetclause}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      LEETCODE_API_URL: http://leetcode-api:3000/
    depends_on:
      - mongo
      - leetcode-api

  # Self-hosted copy of alfa-leetcode-api (https://github.com/alfaarghya/alfa-leetcode-api).
  # Built-in limit: 120 requests/hour per IP, and every call comes from `web`.
  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.4
    container_name: leetclause-leetcode-api
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: leetclause-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpassword}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
