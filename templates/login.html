<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='rocketsanta.png') }}">

</head>
<body>
<header>
    <h1>LeetClaus</h1>
</header>
<div class='accountformcontainer'>
    <form id="login-form" method="POST" action="/login">
    <div class="loginField">
        <input type="text" id="userinput" name="username" placeholder="Username" aria-label="Username" autocomplete="username" value="{{ request.form.get('username', '') }}" required>
    </div>
    <div class="loginField">
        <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    </div>
    <div class="loginField">
        <button type="submit">Login</button>
    </div>
</form>
</div>
{% if error %}
<dialog id="error-popup" class="popup">
    <h2>Couldn't log in</h2>
    <p>{{ error }}</p>
    <form method="dialog">
        <button type="submit">OK</button>
    </form>
</dialog>
<script>
    document.getElementById("error-popup").showModal();
</script>
{% endif %}
</body>
</html>
