<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeetClaus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='rocketsanta.png') }}">
</head>
<body>
<header>
    <a class="brand" href="{{ url_for('index') }}">
        <img id="logo" src="{{ url_for('static', filename='leetclauslogo.png') }}" alt="">
        <h1>LeetClaus</h1>
    </a>
    {% if session.username %}
    <nav class="usernav">
        <span>{{ session.username }}</span>
        <a href="{{ url_for('logout') }}">Log out</a>
    </nav>
    {% endif %}
</header>
<div id="content">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
