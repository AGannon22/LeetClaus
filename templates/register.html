<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='rocketsanta.png') }}">

</head>
<body>
<header>
    <h1>LeetClaus</h1>
</header>
<div class='accountformcontainer'>
    <form id="register-form" method="POST" action="/register">
    <div class="loginField">
        <input type="text" id="userinput" name="username" placeholder="Username" aria-label="Username" autocomplete="username" value="{{ request.form.get('username', '') }}" required>
    </div>
    <div class="loginField">
        <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
    </div>
    <div class="loginField">
        <input type="password" name="confirm_password" placeholder="Confirm Password" aria-label="Confirm Password" autocomplete="new-password" required>
    </div>
    <div class="loginField">
        <input type="text" name="leetcode_username" placeholder="LeetCode Username" aria-label="LeetCode Username" value="{{ request.form.get('leetcode_username', '') }}" required>
    </div>
    <fieldset class="loginField preferredDifficulty">
        <legend>Types of LeetCodes</legend>
        <div class="difficultyOptions">
            <input type="checkbox" id="easyCheck" name="easy" value="EASY">
            <label for="easyCheck" class="difficulty-easy">Easy</label>
            <input type="checkbox" id="mediumCheck" name="medium" value="MEDIUM">
            <label for="mediumCheck" class="difficulty-medium">Medium</label>
            <input type="checkbox" id="hardCheck" name="hard" value="HARD">
            <label for="hardCheck" class="difficulty-hard">Hard</label>
        </div>
    </fieldset>
    <div class="loginField">
        <button type="submit">Create Account</button>
    </div>
</form>
</div>
{% if error %}
<dialog id="error-popup" class="popup">
    <h2>Couldn't create account</h2>
    <p>{{ error }}</p>
    <form method="dialog">
        <button type="submit">OK</button>
    </form>
</dialog>
<script>
    document.getElementById("error-popup").showModal();
</script>
{% endif %}
</body>
</html>
