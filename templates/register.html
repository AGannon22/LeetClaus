<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>LeetClaus</h1>
</header>
<div class='accountformcontainer'>
    <form id="register-form" method="POST" action="/register">
    <div class="loginField">
        <input type="text" id="userinput" name="username" placeholder="Username" aria-label="Username" autocomplete="username" required>
    </div>
    <div class="loginField">
        <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
    </div>
    <div class="loginField">
        <input type="password" name="confirm_password" placeholder="Confirm Password" aria-label="Confirm Password" autocomplete="new-password" required>
    </div>
    <div class="loginField">
        <input type="text" name="leetcode_username" placeholder="LeetCode Username" aria-label="LeetCode Username" required>
    </div>
    <div class="loginField">
        <button type="submit">Create Account</button>
    </div>
</form>
</div>
</body>
</html>
